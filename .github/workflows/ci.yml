name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Reproduce and exercise Linux ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          mkdir "$RUNNER_TEMP/owner-a" "$RUNNER_TEMP/owner-b"
          node scripts/build-native-linux-owner.mjs "$RUNNER_TEMP/owner-a"
          node scripts/build-native-linux-owner.mjs "$RUNNER_TEMP/owner-b"
          cmp "$RUNNER_TEMP/owner-a/linux-owner-x64" "$RUNNER_TEMP/owner-b/linux-owner-x64"
          cmp native/linux-owner-x64 "$RUNNER_TEMP/owner-a/linux-owner-x64"
          TMPDIR="$RUNNER_TEMP" node scripts/check-linux-owner-topology.mjs "$RUNNER_TEMP/owner-a/linux-owner-x64" "$RUNNER_TEMP/owner-a/topology-diagnostics" 2>&1 | tee "$RUNNER_TEMP/owner-a/topology.log"
          TMPDIR="$RUNNER_TEMP" node scripts/check-linux-owner-startup.mjs "$RUNNER_TEMP/owner-a/linux-owner-x64"
      - name: Retain native ownership diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-owner-x64-${{ github.sha }}
          path: ${{ runner.temp }}/owner-a
          if-no-files-found: warn
          retention-days: 3
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up exact npm
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p 'require("./package.json").packageManager')"
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "$package_manager"
          test "$(npm --version)" = "${package_manager#npm@}"
      - name: Install dependencies
        run: npm ci
      - name: Run repository gates
        run: npm run check:source
      - name: Verify deterministic release candidate
        run: npm run release:build -- "${{ runner.temp }}/openclaw-docwen-release"
