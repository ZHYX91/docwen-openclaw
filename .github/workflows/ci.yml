name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up exact npm
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p 'require("./package.json").packageManager')"
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "$package_manager"
          test "$(npm --version)" = "${package_manager#npm@}"
      - name: Install dependencies
        run: npm ci
      - name: Run repository gates
        run: npm run check:source
      - name: Verify deterministic release candidate
        run: npm run release:build -- "${{ runner.temp }}/openclaw-docwen-release"
