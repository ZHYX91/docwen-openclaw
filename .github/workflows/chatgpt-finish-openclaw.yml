          insert = '''async function assertCurrentFileMatches(
  destination: string,
  expectedIdentity: PathIdentity,
  expectedSource: { sizeBytes: number; sha256: string },
): Promise<void> {
  if (expectedIdentity.size !== BigInt(expectedSource.sizeBytes)) {
    throw new DocWenMachineError(
      "docwen_source_changed",
      "The source file changed while DocWen was preparing the in-place result; the newer file was not overwritten.",
    );
  }
  const digest = await hashFile(destination);
  const after = await lstat(destination, { bigint: true });
  if (!samePathIdentity(after, expectedIdentity) || digest !== expectedSource.sha256) {
    throw new DocWenMachineError(
      "docwen_source_changed",
      "The source file changed while DocWen was preparing the in-place result; the newer file was not overwritten.",
    );
  }
}

async function cleanupTemporaryRoot(temporaryRoot: string): Promise<void> {
  try {
    await rm(temporaryRoot, { recursive: true, force: true });
  } catch {
    // The business result, if already published, remains authoritative. A
    // cleanup failure must never turn a successful write into a retryable task
    // failure that could duplicate or overwrite user data.
  }
}

function capabilityOptionProperties(capability: MachineCapability): JsonObject {
  return requiredObject(capability.options_schema.properties, "capability.options_schema.properties");
}

function setAdvertisedOption(
  capability: MachineCapability,
  options: JsonObject,
  candidates: readonly string[],
  value: string | boolean,
  parameterName: string,
): void {
  const properties = capabilityOptionProperties(capability);
  const option = candidates.find((candidate) => Object.prototype.hasOwnProperty.call(properties, candidate));
  if (!option) {
    throw new DocWenMachineError(
      "docwen_option_unsupported",
      `The selected DocWen capability does not support ${parameterName}.`,
    );
  }
  options[option] = value;
}

