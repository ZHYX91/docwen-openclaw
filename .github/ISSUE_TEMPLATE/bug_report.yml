name: Bug report
description: Report a reproducible DocWen OpenClaw plugin problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove private file content, paths, Gateway configuration, credentials, and personal data before attaching logs or screenshots.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, OpenClaw, DocWen, Node.js, and operating-system versions
      placeholder: Plugin 3.0.0; OpenClaw 2026.9.5; DocWen 0.12.0; Node.js 24; Windows 11
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The docwen_* tool involved, if any
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include inspect or doctor output only after removing private paths and content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with supported OpenClaw, plugin, and DocWen versions.
          required: true
        - label: I removed private content, paths, configuration, credentials, and personal data.
          required: true
